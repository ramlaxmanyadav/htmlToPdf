name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # required_ruby_version in htmlToPdf.gemspec is >= 3.1 — test across
        # that whole supported range, not just whatever's newest.
        ruby-version: ["3.1", "3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      # ubuntu-latest ships google-chrome-stable already; the spec suite
      # exercises real headless Chrome through ferrum, plus pdftotext to
      # assert on rendered PDF content.
      - name: Install poppler-utils (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Syntax-check every Ruby file
        run: find lib spec -name '*.rb' | xargs -n1 ruby -c

      - name: Run test suite
        run: bundle exec rake spec

      - name: Build the gem (packaging sanity check)
        run: gem build htmlToPdf.gemspec
